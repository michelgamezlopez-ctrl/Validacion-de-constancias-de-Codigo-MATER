<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación de constancia</title>
<style>
:root{--vino:#7a1236;--verde:#0d7b6b;--oro:#c39a4a;--fondo:#f6f4ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222}.top{height:14px;background:var(--verde)}.wrap{max-width:900px;margin:38px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:30px;box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{color:var(--vino);margin:0 0 8px}.sub{color:var(--verde);font-weight:700}.result{margin-top:22px;background:#fbf7ee;border:1px solid #d7b36a;border-radius:12px;padding:20px}.ok{font-size:22px;color:var(--verde);font-weight:800}.bad{font-size:22px;color:#a12222;font-weight:800}.grid{display:grid;grid-template-columns:210px 1fr;gap:10px 16px;margin-top:18px}.label{font-weight:700}.foot{margin-top:18px;color:#666;font-size:13px}.back{display:inline-block;margin-top:20px;color:var(--vino);font-weight:700;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr;gap:5px}.label{margin-top:8px}}
</style></head><body><div class="top"></div><div class="wrap"><div class="card"><h1>Verificación de constancia</h1><div class="sub">Hospital IMSS-Bienestar de la Mujer · San Cristóbal de Las Casas</div><div id="out" class="result">Validando…</div><a class="back" href="index.html">← Nueva consulta</a></div></div>
<script>
function normName(s){return s.trim().replace(/\s+/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}
async function sha256(s){const b=new TextEncoder().encode(s);const d=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('')}
const p=new URLSearchParams(location.search);const f=p.get('f')||'';const n=p.get('n')||'';const t=p.get('t')||'';
(async()=>{const out=document.getElementById('out');if(!f||!n||!t){out.innerHTML='<div class="bad">Datos incompletos</div><p>Use el QR original o realice una nueva consulta.</p>';return;}try{const hash=await sha256(`${f}|${normName(n)}|${t}`);const data=await fetch('registro_hashes.json',{cache:'no-store'}).then(r=>r.json());const row=data.find(x=>x.hash===hash);if(!row){out.innerHTML='<div class="bad">Constancia no válida o no encontrada</div><p>El folio, nombre o token no coinciden con el registro institucional.</p>';return;}const vigente=row.estatus==='VIGENTE';out.innerHTML=`<div class="${vigente?'ok':'bad'}">${vigente?'CONSTANCIA AUTÉNTICA Y VIGENTE':'CONSTANCIA '+row.estatus}</div><div class="grid"><div class="label">Nombre</div><div>${escapeHtml(n)}</div><div class="label">Folio</div><div>${escapeHtml(f.replaceAll('-','/'))}</div><div class="label">Evento</div><div>Curso-Taller “Código Mater: Cuando Cada Minuto Cuenta”</div><div class="label">Fecha</div><div>14 de octubre de 2026</div><div class="label">Duración</div><div>10 hrs teórico-prácticas</div><div class="label">Institución</div><div>Hospital IMSS-Bienestar de la Mujer, San Cristóbal de Las Casas</div><div class="label">Firmante</div><div>Dr. Benjamín Franco Herrera · Director</div><div class="label">Estatus</div><div>${row.estatus}</div></div><div class="foot">Validación contra el registro institucional del Departamento de Educación en Salud.</div>`;}catch(e){out.innerHTML='<div class="bad">No fue posible completar la validación</div><p>Intente nuevamente más tarde.</p>';}})();
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
